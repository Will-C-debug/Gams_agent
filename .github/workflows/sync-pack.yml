# Opens pull requests that update the gams-sme pack in the GAMS repositories listed in sync/targets.yaml.
# Needs PACK_SYNC_TOKEN: a GitHub App or fine-grained token with contents and pull-request write
# access to the target repositories only.
name: sync-pack

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Pack version label for the PRs (e.g. v0.1.0)
        required: true
      dry-run:
        description: Only show what would change
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pyyaml
      - name: Validate the pack before syncing
        run: python scripts/validate_pack.py
      - name: Sync
        env:
          GH_TOKEN: ${{ secrets.PACK_SYNC_TOKEN }}
          VERSION: ${{ inputs.version || github.event.release.tag_name }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          git config --global user.name "gams-sme pack bot"
          git config --global user.email "gams-sme-pack@users.noreply.github.com"
          args=(--version "$VERSION")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python sync/sync_pack.py "${args[@]}"
